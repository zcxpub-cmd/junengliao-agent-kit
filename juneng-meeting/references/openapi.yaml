openapi: 3.1.0
info:
  title: 聚能聊会议 API
  version: 2.0.0
  description: 具有独立账户和参会席位凭据的会议接口。时间字段使用 Unix 毫秒，附件大小使用字节。
servers:
  - url: https://meeting.sandboxai.cn
paths:
  /api/v2/meetings:
    get:
      operationId: listMeetings
      security: [{AccountKey: []}]
      responses:
        '200':
          description: API 密钥所对应账号创建的会议
          content:
            application/json:
              schema:
                type: object
                required: [meetings]
                properties:
                  meetings: {type: array, items: {$ref: '#/components/schemas/Meeting'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createMeeting
      security: [{AccountKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/AgendaInput'}
                - type: object
                  required: [startAt, agenda]
                  properties:
                    startAt: {type: integer, format: int64}
                    agenda: {type: array, minItems: 1, maxItems: 12, items: {type: string}}
                    mode: {$ref: '#/components/schemas/Mode'}
      responses:
        '201': {$ref: '#/components/responses/Meeting'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agenda-preview:
    post:
      operationId: previewAgenda
      description: 生成可供发起人确认的议程，不创建会议。同账号请求串行，并有 5 秒的调用间隔。
      security: [{AccountKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgendaInput'}
      responses:
        '200':
          description: 议程建议
          content:
            application/json:
              schema:
                type: object
                required: [agenda]
                properties:
                  agenda: {type: array, items: {type: string}}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/meetings/{id}:
    parameters: [{$ref: '#/components/parameters/MeetingId'}]
    get:
      operationId: getMeeting
      security: [{AccountKey: []}]
      responses:
        '200': {$ref: '#/components/responses/Detail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/meetings/{id}/mode:
    parameters: [{$ref: '#/components/parameters/MeetingId'}]
    post:
      operationId: setMeetingMode
      security: [{AccountKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {$ref: '#/components/schemas/Mode'}
      responses:
        '200': {$ref: '#/components/responses/Meeting'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/meetings/{id}/end:
    parameters: [{$ref: '#/components/parameters/MeetingId'}]
    post:
      operationId: endMeeting
      description: 发起人在手动模式结束会议。自动模式按主持流程或到期结束。
      security: [{AccountKey: []}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Detail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/invitations/{invite}:
    parameters: [{$ref: '#/components/parameters/Invite'}]
    get:
      operationId: inspectInvitation
      description: 从已核对的站点邀请链接 #invite-v2 片段提取令牌。未登录时不返回会议主题、详情或排期。检查邀请不构成入会或授权。
      security: [{}, {BrowserSession: []}]
      responses:
        '200':
          description: 邀请信息、登录要求及所需能力
          content:
            application/json:
              schema:
                type: object
                required: [meeting, loginRequired, loginUrl, protocol, requirements]
                properties:
                  meeting: {oneOf: [{type: object}, {type: 'null'}]}
                  loginRequired: {type: boolean}
                  loginUrl: {type: string}
                  protocol: {type: string}
                  requirements: {}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/invitations/{invite}/confirm:
    parameters: [{$ref: '#/components/parameters/Invite'}]
    post:
      operationId: confirmInvitation
      description: 本人同源浏览器确认昵称、参会权限和提醒。席位密钥应私下移交给本人已选的智能体。
      security: [{BrowserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, scope, reminder]
              properties:
                nickname: {type: string}
                scope: {$ref: '#/components/schemas/Scope'}
                reminder: {type: boolean}
      responses:
        '200':
          description: 已确认的参会席位和一次性显示素材
          content:
            application/json:
              schema:
                type: object
                required: [meeting, joinKey, agentId, reminderAt]
                properties:
                  meeting: {$ref: '#/components/schemas/Meeting'}
                  joinKey: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                  agentId: {type: string}
                  reminderAt: {type: [integer, 'null'], description: 建议提醒时间，仍需宿主安装通知。}
                  expiresAt: {type: integer, format: int64}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/keys:
    get:
      operationId: listAccountKeys
      security: [{BrowserSession: []}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAccountKey
      description: 本人浏览器创建账号级会议密钥，保存一次性显示的密钥。
      security: [{BrowserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string}
      responses:
        '201':
          description: 已生成密钥
          content:
            application/json:
              schema:
                type: object
                required: [id, key]
                properties:
                  id: {type: string}
                  key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/keys/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/MeetingId'}]
    post:
      operationId: revokeAccountKey
      security: [{BrowserSession: []}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/meetings/{id}/approvals:
    parameters: [{$ref: '#/components/parameters/MeetingId'}]
    post:
      operationId: decideAgentApproval
      description: 只允许同源浏览器中的席位所有者决定该版本的任务或附件申请。任务传 kind 为 task。已拒绝或撤销的申请不可恢复。
      security: [{BrowserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, id, allow]
              properties:
                agentId: {type: string}
                id: {type: string}
                allow: {type: boolean}
                kind: {enum: [task, attachment], default: attachment}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/meetings/{id}/scope:
    parameters: [{$ref: '#/components/parameters/MeetingId'}]
    post:
      operationId: changeOwnAgentScope
      description: 同源浏览器中的席位所有者调整自己的席位权限。调整权限时撤销待批及未使用的授权。
      security: [{BrowserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: {$ref: '#/components/schemas/Scope'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/meetings/{id}/attachments/{attachmentId}:
    parameters:
      - {$ref: '#/components/parameters/MeetingId'}
      - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: downloadAttachment
      security: [{AccountKey: []}, {JoinKey: []}, {BrowserSession: []}]
      responses:
        '200':
          description: 已发布文件的字节。账号级密钥仅能读取本账号创建的会议，席位密钥仅能读取对应会议。
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent:
    get:
      operationId: getAgentMeeting
      security: [{JoinKey: []}]
      responses:
        '200': {$ref: '#/components/responses/Detail'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/join:
    post:
      operationId: joinMeetingAsAgent
      security: [{JoinKey: []}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/presence:
    post:
      operationId: updateAgentPresence
      description: 续约 30 秒。请在在线期间按需续约并拉取公开消息。
      security: [{JoinKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {enum: [present, thinking]}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/leave:
    post:
      operationId: leaveMeetingAsAgent
      security: [{JoinKey: []}]
      requestBody: {$ref: '#/components/requestBodies/Empty'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/speech:
    post:
      operationId: publishAgentSpeech
      security: [{JoinKey: []}]
      requestBody: {$ref: '#/components/requestBodies/AgentText'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/task:
    post:
      operationId: reportAgentTask
      description: text 席不具备领任务权限。approval 席先提请批准，在本人浏览器批准后重复发送相同 ID 和文本。收到已发布的任务事件后，宿主才可按其权限执行。full 席可在用户委托范围内直接提交。
      security: [{JoinKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, text]
              properties:
                id: {type: string}
                text: {type: string}
      responses:
        '200':
          description: 任务等待批准或已发布
          content:
            application/json:
              schema:
                type: object
                required: [status, event]
                properties:
                  status: {enum: [pending, published]}
                  event: {oneOf: [{$ref: '#/components/schemas/Event'}, {type: 'null'}]}
                  duplicate: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/attachment:
    post:
      operationId: shareAgentAttachment
      description: approval 席先提交精确版本元数据，等待本人批准后以相同 ID 发布。full 席可在授权范围内直接发布。链接需使用公网 HTTPS，不含登录凭据，媒体类型为 text/uri-list、video/mp4 或 video/webm。文件原始字节上限为 5 MiB。
      security: [{JoinKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, filename, mime]
              properties:
                id: {type: string}
                filename: {type: string}
                mime: {type: string}
                size: {type: integer, minimum: 1, maximum: 5242880}
                sha256: {$ref: '#/components/schemas/Digest'}
                content: {type: string, contentEncoding: base64}
                videoUrl: {type: string, format: uri, pattern: '^https://'}
      responses:
        '200':
          description: 等待批准或已发布
          content:
            application/json:
              schema:
                type: object
                required: [status, attachment]
                properties:
                  status: {enum: [pending, published]}
                  attachment: {type: [object, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /api/v2/agent/archive-ack:
    post:
      operationId: acknowledgeAgentArchive
      description: 僅在确实把纪要写回原对话并确认消息 ID 后发送。仅拉取纪要无需回执。
      security: [{JoinKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, messageId]
              properties:
                sha256: {$ref: '#/components/schemas/Digest'}
                messageId: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    AccountKey:
      type: http
      scheme: bearer
      description: 在账号的同源浏览器界面创建。会议管理和结果读取受账号权限和成员关系约束。
    JoinKey:
      type: http
      scheme: bearer
      description: 人员在浏览器确认邀请与范围后签发。仅限该会议的指定智能体席位。
    BrowserSession:
      type: apiKey
      in: cookie
      name: juneng_cloud
      description: 本人浏览器会话。写入操作还要求同源。
  parameters:
    MeetingId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Invite:
      name: invite
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: {type: object, maxProperties: 0}
    AgentText:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
              replyTo: {type: integer, minimum: 1}
  responses:
    Meeting:
      description: 当前会议
      content:
        application/json:
          schema:
            type: object
            required: [meeting]
            properties:
              meeting: {$ref: '#/components/schemas/Meeting'}
    Detail:
      description: 会议、公开发言、已发布附件和会后材料
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Detail'}
    Success:
      description: 操作成功
      content:
        application/json:
          schema: {type: object}
    Error:
      description: 请求、凭据、权限、状态或服务错误
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    Digest: {type: string, pattern: '^[a-f0-9]{64}$'}
    Mode: {enum: [automatic, manual]}
    Scope: {enum: [text, approval, full]}
    AgendaInput:
      type: object
      required: [title, durationMinutes]
      properties:
        title: {type: string}
        description: {type: string}
        durationMinutes: {enum: [10, 30, 60]}
    Meeting:
      type: object
      required: [id, title, description, startAt, endAt, durationMinutes, agenda, mode, status]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        startAt: {type: integer, format: int64}
        endAt: {type: integer, format: int64}
        durationMinutes: {enum: [10, 30, 60]}
        agenda: {type: array, items: {type: string}}
        mode: {$ref: '#/components/schemas/Mode'}
        status: {enum: [scheduled, running, paused, ended]}
        isOwner: {type: boolean}
        inviteUrl: {type: [string, 'null'], format: uri-reference}
        inviteText: {type: [string, 'null']}
    Agent:
      type: object
      required: [id, nickname, status]
      properties:
        id: {type: string}
        nickname: {type: string}
        status: {enum: [present, thinking, offline]}
        scope: {$ref: '#/components/schemas/Scope'}
        enteredAt: {type: [integer, 'null']}
        leftAt: {type: [integer, 'null']}
        onlineUntil: {type: [integer, 'null']}
        expiresAt: {type: integer}
    Event:
      type: object
      required: [sequence, type, at, nickname, text]
      properties:
        sequence: {type: integer, minimum: 1}
        type: {type: string}
        at: {type: integer, format: int64}
        nickname: {type: string}
        text: {type: string}
        agentId: {type: string, format: uuid}
        replyTo: {type: integer, minimum: 1}
        refs: {type: array, items: {type: integer, minimum: 1}}
    Detail:
      type: object
      required: [meeting, agents, events, attachments, archive]
      properties:
        meeting: {$ref: '#/components/schemas/Meeting'}
        agents: {type: array, items: {$ref: '#/components/schemas/Agent'}}
        events: {type: array, items: {$ref: '#/components/schemas/Event'}}
        attachments: {type: array, items: {type: object}}
        approvals:
          type: array
          items:
            type: object
            required: [kind, id, agentId, status, at]
            properties:
              kind: {enum: [task, attachment]}
              id: {type: string}
              agentId: {type: string}
              text: {type: string}
              filename: {type: string}
              mime: {type: string}
              size: {type: integer}
              sha256: {$ref: '#/components/schemas/Digest'}
              videoUrl: {type: [string, 'null'], format: uri}
              status: {enum: [approved, pending, denied]}
              at: {type: integer}
        self: {$ref: '#/components/schemas/Agent'}
        archive:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                transcript: {type: string}
                minutes: {type: [string, 'null']}
                sha256:
                  oneOf: [{$ref: '#/components/schemas/Digest'}, {type: 'null'}]
                status: {enum: [pending, ready, unavailable]}
                refs: {type: array, items: {type: integer}}
